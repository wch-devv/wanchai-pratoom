<svg width="600" height="260" viewBox="0 0 600 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card { fill: #141321; stroke: #fe428e; stroke-width: 1; stroke-opacity: 0.4; rx: 10px; }
    .title { font-family: 'Segoe UI', Ubuntu, Sans-Serif; font-size: 16px; font-weight: 700; fill: #fe428e; }
    .category-title { font-family: 'Segoe UI', Ubuntu, Sans-Serif; font-size: 13px; font-weight: 700; fill: #a9fef7; }
    .desc { font-family: 'Segoe UI', Ubuntu, Sans-Serif; font-size: 11px; fill: #a0a0a0; }
    .lang-item { font-family: 'Segoe UI', Ubuntu, Sans-Serif; font-size: 12px; fill: #e1e1e6; }
    .pct { font-weight: 600; fill: #ffffff; }
  </style>

  <!-- Background Card -->
  <rect class="card" x="1" y="1" width="598" height="258" />

  <!-- Title -->
  <text x="25" y="32" class="title">Language Usage Across Projects (Combined)</text>

  <!-- Multi-segment Progress Bar -->
  <g transform="translate(25, 48)">
    <clipPath id="bar-clip">
      <rect x="0" y="0" width="550" height="10" rx="5" />
    </clipPath>
    <rect x="0" y="0" width="550" height="10" fill="#2d2b55" rx="5" />
    <g clip-path="url(#bar-clip)">
      <!-- JS 46.58% -> width 256 -->
      <rect x="0" y="0" width="256" height="10" fill="#f7df1e" />
      <!-- EJS 42.51% -> width 234 -->
      <rect x="256" y="0" width="234" height="10" fill="#b026ff" />
      <!-- HTML 8.78% -> width 48 -->
      <rect x="490" y="0" width="48" height="10" fill="#e34f26" />
      <!-- CSS 1.80% -> width 10 -->
      <rect x="538" y="0" width="10" height="10" fill="#1572b6" />
      <!-- Go & Others 0.33% -> width 2 -->
      <rect x="548" y="0" width="2" height="10" fill="#00add8" />
    </g>
  </g>

  <!-- Category 1: Frontend -->
  <g transform="translate(25, 82)">
    <text x="0" y="0" class="category-title">🎨 Frontend (99.68%)</text>
    <text x="0" y="15" class="desc">UI/UX, Client-side logic &amp; Server-side template rendering</text>
    
    <circle cx="6" cy="30" r="4" fill="#f7df1e" />
    <text x="16" y="34" class="lang-item">JavaScript <tspan class="pct">46.58%</tspan></text>

    <circle cx="160" cy="30" r="4" fill="#b026ff" />
    <text x="170" y="34" class="lang-item">EJS <tspan class="pct">42.51%</tspan></text>

    <circle cx="280" cy="30" r="4" fill="#e34f26" />
    <text x="290" y="34" class="lang-item">HTML <tspan class="pct">8.78%</tspan></text>

    <circle cx="390" cy="30" r="4" fill="#1572b6" />
    <text x="400" y="34" class="lang-item">CSS &amp; Less <tspan class="pct">1.81%</tspan></text>
  </g>

  <!-- Category 2: Backend & Systems -->
  <g transform="translate(25, 150)">
    <text x="0" y="0" class="category-title">⚙️ Backend &amp; Systems (0.22%)</text>
    <text x="0" y="15" class="desc">Core logic, RESTful APIs, Services &amp; Data processing</text>

    <circle cx="6" cy="30" r="4" fill="#00add8" />
    <text x="16" y="34" class="lang-item">Go <tspan class="pct">0.10%</tspan></text>

    <circle cx="120" cy="30" r="4" fill="#3572A5" />
    <text x="130" y="34" class="lang-item">Python <tspan class="pct">0.08%</tspan></text>

    <circle cx="240" cy="30" r="4" fill="#b07219" />
    <text x="250" y="34" class="lang-item">Java <tspan class="pct">0.04%</tspan></text>
  </g>

  <!-- Category 3: DevOps & Others -->
  <g transform="translate(25, 212)">
    <text x="0" y="0" class="category-title">🚀 DevOps &amp; Others (0.14%)</text>
    <text x="0" y="15" class="desc">Containerization (Docker), Build tools &amp; Automation scripts</text>

    <circle cx="6" cy="30" r="4" fill="#89e051" />
    <text x="16" y="34" class="lang-item">Shell / Make <tspan class="pct">0.07%</tspan></text>

    <circle cx="140" cy="30" r="4" fill="#F05138" />
    <text x="150" y="34" class="lang-item">Swift <tspan class="pct">0.04%</tspan></text>

    <circle cx="240" cy="30" r="4" fill="#384d54" />
    <text x="250" y="34" class="lang-item">Dockerfile &amp; Other <tspan class="pct">0.03%</tspan></text>
  </g>
</svg>
